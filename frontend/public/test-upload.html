<!DOCTYPE html>
<html>
<head>
    <title>Image Upload Test</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; }
        .test-section { border: 1px solid #ddd; padding: 20px; margin: 10px 0; border-radius: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .status { margin: 10px 0; padding: 10px; border-radius: 3px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        #output { background: #f5f5f5; padding: 15px; border-radius: 5px; font-family: monospace; white-space: pre-wrap; max-height: 400px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Frontend to Backend Image Upload Test</h1>
    
    <div class="test-section">
        <h2>1. Connection Test</h2>
        <button onclick="testConnection()">Test Backend Connection</button>
        <div id="connectionStatus"></div>
    </div>

    <div class="test-section">
        <h2>2. Text Request Test</h2>
        <button onclick="testTextRequest()">Send Text Request</button>
        <div id="textStatus"></div>
    </div>

    <div class="test-section">
        <h2>3. Image Upload Test</h2>
        <input type="file" id="imageInput" accept="image/*" />
        <button onclick="testImageRequest()">Send Image Request</button>
        <div id="imageStatus"></div>
    </div>

    <div class="test-section">
        <h2>Test Output</h2>
        <div id="output">Awaiting test results...</div>
    </div>

    <script>
        const baseURL = 'http://127.0.0.1:8000';
        const apiURL = `${baseURL}/api/v1/chat`;

        function log(message) {
            const output = document.getElementById('output');
            output.textContent += message + '\n';
            output.scrollTop = output.scrollHeight;
        }

        function addStatus(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        async function testConnection() {
            log('\n=== TESTING CONNECTION ===');
            addStatus('connectionStatus', 'Testing...', 'info');
            
            try {
                log(`Attempting to reach: ${baseURL}`);
                const response = await fetch(`${baseURL}/health`, {
                    method: 'GET',
                    timeout: 5000
                });
                log(`✓ Response status: ${response.status}`);
                addStatus('connectionStatus', '✅ Backend is reachable!', 'success');
            } catch (error) {
                log(`✗ Connection failed: ${error.message}`);
                addStatus('connectionStatus', `❌ Cannot reach backend: ${error.message}`, 'error');
            }
        }

        async function testTextRequest() {
            log('\n=== TEXT REQUEST TEST ===');
            addStatus('textStatus', 'Sending...', 'info');
            
            try {
                log(`POST ${apiURL}`);
                const payload = {
                    message: 'Tell me about Tangier',
                    image_data: null
                };
                log(`Payload: ${JSON.stringify(payload, null, 2)}`);
                
                const response = await fetch(apiURL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                    timeout: 30000
                });

                log(`✓ Response status: ${response.status}`);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    log(`✗ Error response: ${errorText}`);
                    addStatus('textStatus', `❌ Request failed: ${response.status}`, 'error');
                    return;
                }

                const data = await response.json();
                log(`✓ Response received:`);
                log(`${data.response}`);
                addStatus('textStatus', '✅ Text request successful!', 'success');
            } catch (error) {
                log(`✗ Error: ${error.message}`);
                log(`Stack: ${error.stack}`);
                addStatus('textStatus', `❌ Error: ${error.message}`, 'error');
            }
        }

        async function testImageRequest() {
            log('\n=== IMAGE REQUEST TEST ===');
            addStatus('imageStatus', 'Processing...', 'info');
            
            const fileInput = document.getElementById('imageInput');
            if (!fileInput.files.length) {
                log('✗ No image selected');
                addStatus('imageStatus', '❌ Please select an image first', 'error');
                return;
            }

            const file = fileInput.files[0];
            log(`Selected file: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`);

            try {
                // Read file as data URI
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const dataURI = event.target.result;
                    log(`✓ File converted to data URI (${dataURI.length} chars)`);
                    log(`Data URI preview: ${dataURI.substring(0, 50)}...`);

                    try {
                        log(`POST ${apiURL}`);
                        const payload = {
                            message: 'What landmark is this?',
                            image_data: dataURI
                        };
                        log(`Payload image_data length: ${dataURI.length} chars`);

                        const response = await fetch(apiURL, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(payload),
                            timeout: 60000
                        });

                        log(`✓ Response status: ${response.status}`);

                        if (!response.ok) {
                            const errorText = await response.text();
                            log(`✗ Error response: ${errorText}`);
                            addStatus('imageStatus', `❌ Request failed: ${response.status}`, 'error');
                            return;
                        }

                        const data = await response.json();
                        log(`✓ Response received:`);
                        log(`${data.response}`);
                        addStatus('imageStatus', '✅ Image request successful!', 'success');
                    } catch (error) {
                        log(`✗ Error: ${error.message}`);
                        log(`Stack: ${error.stack}`);
                        addStatus('imageStatus', `❌ Error: ${error.message}`, 'error');
                    }
                };
                reader.readAsDataURL(file);
            } catch (error) {
                log(`✗ File reading error: ${error.message}`);
                addStatus('imageStatus', `❌ Error: ${error.message}`, 'error');
            }
        }

        // Initial log
        log('Frontend version ready for testing');
        log(`Backend URL: ${baseURL}`);
        log(`API endpoint: ${apiURL}`);
    </script>
</body>
</html>
